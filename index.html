<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>惠心的全家效期排面練習</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-card {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .header { text-align: center; }
        .title {
            color: #00873c;
            font-size: 18px;
            font-weight: 800;
            margin: 0 0 4px 0;
        }
        
        .info-bar {
            background: #f1f8e9;
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .score-val { color: #00873c; font-size: 15px; font-weight: 900; }
        .correct-val { color: #2e7d32; }
        .wrong-val { color: #d32f2f; }

        .year-warning {
            background: #fff3e0;
            border: 1px solid #ff9800;
            color: #e65100;
            padding: 4px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            margin-top: 4px;
            display: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; transform: scale(1.01); }
            100% { opacity: 0.8; }
        }

        .section-label {
            font-size: 12px;
            font-weight: 800;
            color: #424242;
            margin: 4px 0 2px 2px;
        }

        /* 待選區 3x2 網格 */
        .source-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            min-height: 76px;
        }

        .date-card {
            background: linear-gradient(180deg, #009845 0%, #007b36 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,135,60,0.2);
            transition: all 0.15s ease;
            user-select: none;
        }

        .date-card:active { transform: scale(0.95); }

        /* 直式貨架陳列區 */
        .shelf-container {
            background: #f4f6f8;
            border: 2px solid #b0bec5;
            border-radius: 12px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 250px;
            position: relative;
        }

        .shelf-header-tag {
            background: #78909c;
            color: white;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 4px;
            align-self: flex-start;
        }

        .shelf-footer-tag {
            background: #e65100;
            color: white;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 4px;
            align-self: flex-start;
            margin-top: auto;
        }

        .shelf-slot {
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px dashed #cfd8dc;
            border-radius: 6px;
            height: 33px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .shelf-card {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #00a0e9 0%, #0082c3 100%);
            color: white;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,160,233,0.3);
            cursor: pointer;
        }

        /* 底部控制區 */
        .feedback-area {
            min-height: 20px;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 4px;
        }
        .text-success { color: #2e7d32; }
        .text-error { color: #c62828; }

        .btn-group { display: flex; gap: 6px; }

        .btn-action {
            flex: 1;
            border: none;
            border-radius: 16px;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
        
        .btn-check { background: #00873c; color: white; }
        .btn-next { background: #00a0e9; color: white; }
        .btn-reset { background: #90a4ae; color: white; flex: 0.5; }
        .btn-action:active { opacity: 0.85; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <div class="title">🏪 惠心全家效期排面練習</div>
        <div class="info-bar">
            <span id="today-display">📅 今日: --</span>
            <div>
                得分:<span class="score-val" id="total-score">0</span> ｜ 
                對:<span class="correct-val" id="correct-count">0</span> 
                錯:<span class="wrong-val" id="wrong-count">0</span>
            </div>
        </div>
        <div class="year-warning" id="year-notice">
            ⚠️ 注意：這題有跨到明年喔！1 月要放在最後面（最上面）！
        </div>
    </div>

    <!-- 待選區 -->
    <div>
        <div class="section-label">👇 選擇點擊卡片（擺入貨架）：</div>
        <div class="source-grid" id="source-tags"></div>
    </div>

    <!-- 直式貨架陳列區（視角修正：下方為最前面） -->
    <div>
        <div class="section-label" style="color:#00a0e9;">🛒 貨架縱深陳列（由內而外）：</div>
        <div class="shelf-container">
            <div class="shelf-header-tag">⬆️ 貨架最後面（遠效期 / 後賣）</div>
            
            <div class="shelf-slot" id="slot-5"></div>
            <div class="shelf-slot" id="slot-4"></div>
            <div class="shelf-slot" id="slot-3"></div>
            <div class="shelf-slot" id="slot-2"></div>
            <div class="shelf-slot" id="slot-1"></div>
            <div class="shelf-slot" id="slot-0"></div>

            <div class="shelf-footer-tag">⬇️ 貨架最前面（近效期 / 先賣）</div>
        </div>
    </div>

    <!-- 底部控制區 -->
    <div>
        <div class="feedback-area" id="feedback"></div>
        <div class="btn-group">
            <button class="btn-action btn-check" id="check-btn" onclick="checkAnswer()">送出檢查</button>
            <button class="btn-action btn-next" onclick="generateQuestion()">下一題</button>
            <button class="btn-action btn-reset" onclick="resetScore()">重置</button>
        </div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playFamilyMartTheme() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const notes = [
            { freq: 698.46, duration: 0.22, time: 0 },
            { freq: 587.33, duration: 0.22, time: 0.22 },
            { freq: 440.00, duration: 0.22, time: 0.44 },
            { freq: 587.33, duration: 0.22, time: 0.66 },
            { freq: 659.25, duration: 0.22, time: 0.88 },
            { freq: 880.00, duration: 0.5,  time: 1.10 }
        ];
        notes.forEach(note => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = note.freq;
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime + note.time);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + note.time + note.duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + note.time);
            osc.stop(audioCtx.currentTime + note.time + note.duration);
        });
    }

    function playClickSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    }

    function playErrorSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    let currentCards = [];
    let userAnswers = [];
    let score = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let isChecked = false;

    const today = new Date();
    document.getElementById('today-display').innerText = `📅 今日: ${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;

    function generateQuestion() {
        document.getElementById('feedback').innerText = '';
        document.getElementById('year-notice').style.display = 'none';
        
        for(let i=0; i<6; i++) {
            document.getElementById(`slot-${i}`).innerHTML = '';
        }
        
        userAnswers = [];
        isChecked = false;
        
        let cards = [];
        let hasCrossYear = false;

        while(cards.length < 6) {
            let addDays = Math.floor(Math.random() * 85) + 1;
            let futureDate = new Date(today.getTime());
            futureDate.setDate(today.getDate() + addDays);

            let month = futureDate.getMonth() + 1;
            let date = futureDate.getDate();
            let displayStr = `${month}/${date}`;
            
            if (futureDate.getFullYear() > today.getFullYear()) {
                hasCrossYear = true;
            }

            if (!cards.some(c => c.display === displayStr)) {
                cards.push({
                    display: displayStr,
                    timestamp: new Date(futureDate.getFullYear(), futureDate.getMonth(), futureDate.getDate()).getTime()
                });
            }
        }

        if (hasCrossYear) {
            document.getElementById('year-notice').style.display = 'block';
        }

        currentCards = [...cards];
        let shuffled = [...cards].sort(() => Math.random() - 0.5);

        const sourceContainer = document.getElementById('source-tags');
        sourceContainer.innerHTML = '';
        shuffled.forEach(cardObj => {
            let div = document.createElement('div');
            div.className = 'date-card';
            div.innerText = cardObj.display;
            div.onclick = () => selectTag(cardObj, div);
            sourceContainer.appendChild(div);
        });
    }

    function selectTag(cardObj, element) {
        if (element.style.visibility === 'hidden' || userAnswers.length >= 6) return;
        playClickSound();
        element.style.visibility = 'hidden';
        
        let targetSlotIndex = userAnswers.length;
        userAnswers.push(cardObj);

        let slotEl = document.getElementById(`slot-${targetSlotIndex}`);
        let div = document.createElement('div');
        div.className = 'shelf-card';
        div.innerText = cardObj.display;
        div.onclick = () => deselectTag(cardObj, element, targetSlotIndex);
        slotEl.appendChild(div);
    }

    function deselectTag(cardObj, sourceElement, slotIndex) {
        if (isChecked) return;
        playClickSound();
        
        if (slotIndex === userAnswers.length - 1) {
            sourceElement.style.visibility = 'visible';
            document.getElementById(`slot-${slotIndex}`).innerHTML = '';
            userAnswers.pop();
        }
    }

    function checkAnswer() {
        if (isChecked) return;

        if (userAnswers.length < currentCards.length) {
            playErrorSound();
            document.getElementById('feedback').className = 'feedback-area text-error';
            document.getElementById('feedback').innerText = '請選滿 6 張卡片擺好貨架喔！';
            return;
        }

        isChecked = true;

        let sorted = [...currentCards].sort((a, b) => a.timestamp - b.timestamp);
        let isCorrect = JSON.stringify(userAnswers.map(c => c.timestamp)) === JSON.stringify(sorted.map(c => c.timestamp));

        const feedbackEl = document.getElementById('feedback');
        if (isCorrect) {
            playFamilyMartTheme();
            score += 10;
            correctCount += 1;
            feedbackEl.className = 'feedback-area text-success';
            feedbackEl.innerText = '🎉 太棒了！貨架陳列完全正確！+10分';
        } else {
            playErrorSound();
            wrongCount += 1;
            feedbackEl.className = 'feedback-area text-error';
            let sortedDisplays = sorted.map(c => c.display).join(' (前) ⬅️ ');
            feedbackEl.innerText = '❌ 從前到後應為：' + sortedDisplays;
        }

        updateScoreBoard();
    }

    function updateScoreBoard() {
        document.getElementById('total-score').innerText = score;
        document.getElementById('correct-count').innerText = correctCount;
        document.getElementById('wrong-count').innerText = wrongCount;
    }

    function resetScore() {
        playClickSound();
        score = 0;
        correctCount = 0;
        wrongCount = 0;
        updateScoreBoard();
        generateQuestion();
    }

    generateQuestion();
</script>

</body>
</html>
